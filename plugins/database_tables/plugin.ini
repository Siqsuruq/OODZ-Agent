[plugin]
name = database_tables
description = List tables and views available through a configured TDBC database profile.
category = database
keywords = database,sql,tdbc,postgres,tables,schema
permission = read
entrypoint = plugin.tcl
handler = ::plugins::database_tables::execute
parameters = {"type":"object","properties":{"profile":{"type":"string","description":"Configured profile name; omit to use default_profile."},"pattern":{"type":"string","description":"Optional SQL metadata pattern such as public.% or patient%."}},"required":[],"additionalProperties":false}

[settings]
profile_file = .oodz/databases.ini

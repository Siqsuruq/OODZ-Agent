[plugin]
name = fossil_redo
description = Reapply the most recently undone Fossil change to exactly one workspace-relative file. The path may currently be missing. This operation requires approval.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_redo::execute
parameters = {"type":"object","properties":{"path":{"type":"string"}},"required":["path"],"additionalProperties":false}

[settings]
executable = fossil

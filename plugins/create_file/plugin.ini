[plugin]
name = create_file
description = Create one new UTF-8 workspace file with complete content. Use this for new source or text files. Fails if the file already exists.
category = filesystem
keywords = file,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::create_file::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"New file path relative to the workspace root."},"content":{"type":"string","description":"Complete UTF-8 content for the new file."}},"required":["path","content"],"additionalProperties":false}

[plugin]
name = database_execute
description = Execute one parameterized SQL write or DDL statement through a write-enabled TDBC profile. Always requires approval.
category = database
keywords = database,sql,tdbc,postgres,insert,update,delete,ddl
permission = write
entrypoint = plugin.tcl
handler = ::plugins::database_execute::execute
parameters = {"type":"object","properties":{"profile":{"type":"string","description":"Configured write-enabled profile; omit to use default_profile."},"sql":{"type":"string","minLength":1,"description":"One SQL statement using TDBC :name bound parameters."},"parameters":{"type":"object","description":"Values for named SQL parameters."},"max_rows":{"type":"integer","minimum":1,"description":"Maximum rows retained from a RETURNING clause, capped by the profile file."}},"required":["sql"],"additionalProperties":false}

[settings]
profile_file = .oodz/databases.ini

[plugin]
name = sqitch_verify
description = Run all applicable Sqitch verification scripts against the default target for the project in the configured workspace. This executes project-controlled database client scripts, requires approval, and accepts no model-selected target, database URI, change range, variable, or option.
category = database
keywords = sqitch,database,migration,schema,deployment,verify,validation
permission = write
entrypoint = plugin.tcl
handler = ::plugins::sqitch_verify::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = sqitch

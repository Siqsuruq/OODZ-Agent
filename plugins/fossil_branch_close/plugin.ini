[plugin]
name = fossil_branch_close
description = Mark one named Fossil branch closed in the local repository. The branch name is bounded, autosync is disabled, and approval is required. This does not delete branch history.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_branch_close::execute
parameters = {"type":"object","properties":{"name":{"type":"string"}},"required":["name"],"additionalProperties":false}

[settings]
executable = fossil
max_name_chars = 200

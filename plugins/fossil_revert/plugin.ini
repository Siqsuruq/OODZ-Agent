[plugin]
name = fossil_revert
description = Discard uncommitted changes in exactly one existing workspace-relative file by reverting it to the current Fossil checkout version. This destructive operation requires approval; Fossil records an undo snapshot.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_revert::execute
parameters = {"type":"object","properties":{"path":{"type":"string"}},"required":["path"],"additionalProperties":false}

[settings]
executable = fossil

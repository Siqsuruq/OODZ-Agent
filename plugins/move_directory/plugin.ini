[plugin]
name = move_directory
description = Move or rename one workspace directory without overwriting. Use move_file for files.
category = filesystem
keywords = move,rename,folder,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::move_directory::execute
parameters = {"type":"object","properties":{"source":{"type":"string","description":"Existing source directory relative to the workspace root. The workspace root itself cannot be moved."},"destination":{"type":"string","description":"New directory path relative to the workspace root. Its parent must already exist."}},"required":["source","destination"],"additionalProperties":false}

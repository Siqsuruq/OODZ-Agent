[plugin]
name = open_browser
description = Open the Linux or Windows desktop's default web browser. If the user asks only to open the browser and gives no destination, call this tool immediately with an empty object and do not ask for a URL; it will open a blank page. If the user supplies a destination, pass its complete HTTP or HTTPS URL. Rejects local files, credentials, model-selected non-web schemes, whitespace, control characters, and arbitrary command options; always requires approval.
category = desktop
keywords = browser,web,url,open,launch,website,documentation
permission = write
platforms = linux,windows
requires_linux = xdg-open
requires_windows = rundll32.exe
entrypoint = plugin.tcl
handler = ::plugins::open_browser::execute
parameters = {"type":"object","properties":{"url":{"type":"string","minLength":1,"maxLength":2048,"description":"Complete http:// or https:// destination when the user supplied one. Otherwise omit this property; never ask the user for it merely to open the browser."}},"required":[],"additionalProperties":false}

[settings]
linux_executable = xdg-open
windows_executable = rundll32.exe
default_url = about:blank

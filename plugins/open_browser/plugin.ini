[plugin]
name = open_browser
description = Open one explicitly provided HTTP or HTTPS URL in the Linux or Windows desktop's default web browser. Rejects local files, credentials, non-web schemes, whitespace, control characters, and arbitrary command options; always requires approval.
category = desktop
keywords = browser,web,url,open,launch,website,documentation
permission = write
platforms = linux,windows
requires_linux = xdg-open
requires_windows = rundll32.exe
entrypoint = plugin.tcl
handler = ::plugins::open_browser::execute
parameters = {"type":"object","properties":{"url":{"type":"string","minLength":1,"maxLength":2048,"description":"Complete http:// or https:// URL to open."}},"required":["url"],"additionalProperties":false}

[settings]
linux_executable = xdg-open
windows_executable = rundll32.exe

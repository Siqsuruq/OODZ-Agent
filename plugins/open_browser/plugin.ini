[plugin]
name = open_browser
description = Open the Linux or Windows desktop's default web browser, optionally at an explicitly provided HTTP or HTTPS URL. Without a URL it opens a blank page. Rejects local files, credentials, model-selected non-web schemes, whitespace, control characters, and arbitrary command options; always requires approval.
category = desktop
keywords = browser,web,url,open,launch,website,documentation
permission = write
platforms = linux,windows
requires_linux = xdg-open
requires_windows = rundll32.exe
entrypoint = plugin.tcl
handler = ::plugins::open_browser::execute
parameters = {"type":"object","properties":{"url":{"type":"string","minLength":1,"maxLength":2048,"description":"Optional complete http:// or https:// URL; omit it to open a blank page."}},"required":[],"additionalProperties":false}

[settings]
linux_executable = xdg-open
windows_executable = rundll32.exe
default_url = about:blank

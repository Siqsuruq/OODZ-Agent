[plugin]
name = replace_text
description = Replace one unique exact text fragment in an existing UTF-8 workspace file. Use create_file for new files, write_file for complete rewrites, and apply_patch for multiple changes.
category = filesystem
keywords = replace,edit,text,file,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::replace_text::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Existing file path relative to the workspace root."},"old_text":{"type":"string","description":"Exact text that must appear exactly once."},"new_text":{"type":"string","description":"Replacement text."}},"required":["path","old_text","new_text"],"additionalProperties":false}

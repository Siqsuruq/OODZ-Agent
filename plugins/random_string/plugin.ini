[plugin]
name = random_string
description = Generate a non-cryptographic random string for test data, temporary labels, examples, and harmless identifiers. Never use it for passwords, keys, authentication tokens, or security-sensitive values.
category = utility
keywords = random,string,text,test data,identifier,label,alphanumeric,hex
permission = read
entrypoint = plugin.tcl
handler = ::plugins::random_string::execute
parameters = {"type":"object","properties":{"length":{"type":"integer","description":"Number of characters to generate. Defaults to 16."},"alphabet":{"type":"string","enum":["alphanumeric","lowercase","uppercase","hex"],"description":"Character set preset. Defaults to alphanumeric."}},"required":[],"additionalProperties":false}

[settings]
max_length = 4096


[plugin]
name = apply_patch
description = Atomically apply multiple structured exact-text replacements to an existing UTF-8 workspace file. Use replace_text for one change.
category = filesystem
keywords = file,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::apply_patch::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Existing UTF-8 file path relative to the workspace root."},"changes":{"type":"array","minItems":1,"maxItems":100,"description":"Ordered exact replacements applied atomically. Every item must contain only old_text and new_text.","items":{"type":"object","properties":{"old_text":{"type":"string","minLength":1,"description":"Exact text that must occur exactly once at the time this change is applied."},"new_text":{"type":"string","description":"Replacement text; use an empty string to delete old_text."}},"required":["old_text","new_text"],"additionalProperties":false}}},"required":["path","changes"],"additionalProperties":false}

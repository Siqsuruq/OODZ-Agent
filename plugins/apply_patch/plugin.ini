[plugin]
name = apply_patch
description = Atomically apply one or more exact SEARCH/REPLACE blocks to an existing UTF-8 workspace file.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::apply_patch::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Existing UTF-8 file path relative to the workspace root."},"patch":{"type":"string","description":"Blocks formatted as <<<<<<< SEARCH, exact old text, =======, replacement text, and >>>>>>> REPLACE."}},"required":["path","patch"],"additionalProperties":false}

[plugin]
name = copy_file
description = Copy one workspace file to a new workspace path without overwriting an existing target.
category = filesystem
keywords = file,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::copy_file::execute
parameters = {"type":"object","properties":{"source":{"type":"string","description":"Existing source file relative to the workspace root."},"destination":{"type":"string","description":"New destination path relative to the workspace root."}},"required":["source","destination"],"additionalProperties":false}

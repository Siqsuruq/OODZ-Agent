[plugin]
name = fossil_branch_info
description = Show metadata for one named branch in the current Fossil checkout. The branch name is bounded, and the tool cannot select another repository or pass extra Fossil options.
category = vcs
keywords = repository,version control,source control,check-in
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_branch_info::execute
parameters = {"type":"object","properties":{"name":{"type":"string"}},"required":["name"],"additionalProperties":false}

[settings]
executable = fossil
max_name_chars = 200

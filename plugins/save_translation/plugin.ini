[plugin]
name = save_translation
description = Save one label and its native-script Portuguese, Simplified Chinese, Russian, French, Spanish, and English translations to the configured SaaS translation endpoint. Never transliterate any translation. Use only after producing every translation.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::save_translation::execute
parameters = {"type":"object","properties":{"original":{"type":"string","description":"Original SaaS label identifier or source text."},"pt_pt":{"type":"string","description":"Native Portuguese translation; never transliterate."},"ch_ch":{"type":"string","description":"Simplified Chinese translation written with Chinese characters; never transliterate or use Pinyin."},"ru_ru":{"type":"string","description":"Russian translation written in Cyrillic; never transliterate into Latin characters."},"fr_fr":{"type":"string","description":"Native French translation; never transliterate."},"es_es":{"type":"string","description":"Native Spanish translation; never transliterate."},"en_us":{"type":"string","description":"Native English translation; it may differ from original."},"dry_run":{"type":"boolean","description":"When true, validate and display the JSON payload without sending it."}},"required":["original","pt_pt","ch_ch","ru_ru","fr_fr","es_es","en_us"],"additionalProperties":false}

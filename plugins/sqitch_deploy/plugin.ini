[plugin]
name = sqitch_deploy
description = Deploy all pending Sqitch changes to the project's configured default target. This executes project-controlled database scripts, requires approval, and accepts no model-selected target, database URI, destination change, variable, mode, client, registry, or option.
category = database
keywords = sqitch,database,migration,schema,deployment,deploy,apply,pending,upgrade
permission = write
entrypoint = plugin.tcl
handler = ::plugins::sqitch_deploy::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = sqitch

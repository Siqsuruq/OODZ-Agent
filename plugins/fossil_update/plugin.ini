[plugin]
name = fossil_update
description = Update the entire Fossil checkout to the unique descendant leaf already available in the local repository while retaining uncommitted changes. Autosync is disabled and approval is required.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_update::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

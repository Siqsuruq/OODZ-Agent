[plugin]
name = sqitch_add
description = Add one safely named change to the default Sqitch plan and generate its standard scripts using configured templates. Requires a bounded note and approval. Dependencies, conflicts, engines, targets, plan paths, template selection, variables, editor launching, and arbitrary options are unavailable to the model.
category = database
keywords = sqitch,database,migration,schema,change,add,create,script,plan
permission = write
entrypoint = plugin.tcl
handler = ::plugins::sqitch_add::execute
parameters = {"type":"object","properties":{"change":{"type":"string","minLength":1,"maxLength":200,"pattern":"^[A-Za-z0-9][A-Za-z0-9_.+-]*$","description":"New change name using letters, digits, underscore, dot, plus, or hyphen."},"note":{"type":"string","minLength":1,"maxLength":500,"description":"Brief reason for the database change."}},"required":["change","note"],"additionalProperties":false}

[settings]
executable = sqitch

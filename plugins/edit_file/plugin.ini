[plugin]
name = edit_file
description = Replace one unique, exact text fragment in an existing UTF-8 workspace file.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::edit_file::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Existing file path relative to the workspace root."},"old_text":{"type":"string","description":"Exact text that must appear once in the file."},"new_text":{"type":"string","description":"Replacement text."}},"required":["path","old_text","new_text"],"additionalProperties":false}

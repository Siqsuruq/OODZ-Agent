[plugin]
name = write_file
description = Replace the complete content of one existing UTF-8 workspace file. Use create_file for a new file and replace_text for a small exact change.
category = filesystem
keywords = file,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::write_file::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Existing file path relative to the workspace root."},"content":{"type":"string","description":"Complete replacement UTF-8 content."}},"required":["path","content"],"additionalProperties":false}

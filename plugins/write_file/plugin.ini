[plugin]
name = write_file
description = Write UTF-8 text to a file relative to the workspace root.
category = filesystem
keywords = file,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::write_file::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"File path relative to the workspace root."},"content":{"type":"string","description":"Complete UTF-8 content to write to the file."}},"required":["path","content"],"additionalProperties":false}

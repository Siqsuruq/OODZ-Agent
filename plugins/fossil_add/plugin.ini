[plugin]
name = fossil_add
description = Schedule one existing workspace-relative file for addition at the next Fossil commit. This mutating operation requires approval.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_add::execute
parameters = {"type":"object","properties":{"path":{"type":"string"}},"required":["path"],"additionalProperties":false}

[settings]
executable = fossil

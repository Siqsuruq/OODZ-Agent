[plugin]
name = unzip
description = Extract one existing workspace ZIP archive into a new workspace directory using Tcl 9 zipfs. Extraction is bounded and never overwrites an existing destination.
category = archive
keywords = zip,archive,extract,decompress,unpack
permission = write
entrypoint = plugin.tcl
handler = ::plugins::unzip::execute
parameters = {"type":"object","properties":{"source":{"type":"string","description":"Existing .zip file relative to the workspace root."},"destination":{"type":"string","description":"New extraction directory relative to the workspace root."}},"required":["source","destination"],"additionalProperties":false}

[settings]
max_entries = 10000
max_uncompressed_bytes = 1073741824


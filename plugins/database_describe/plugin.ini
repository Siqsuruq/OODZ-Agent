[plugin]
name = database_describe
description = Describe one table using TDBC metadata, including columns and primary and foreign keys.
category = database
keywords = database,sql,tdbc,postgres,columns,keys,schema
permission = read
entrypoint = plugin.tcl
handler = ::plugins::database_describe::execute
parameters = {"type":"object","properties":{"profile":{"type":"string","description":"Configured profile name; omit to use default_profile."},"table":{"type":"string","minLength":1,"description":"Exact table name reported by database_tables."}},"required":["table"],"additionalProperties":false}

[settings]
profile_file = .oodz/databases.ini

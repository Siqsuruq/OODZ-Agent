[plugin]
name = fossil_ls
description = List every managed file in the current Fossil checkout with its change status. This read-only tool accepts no paths, versions, repositories, or extra options.
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_ls::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

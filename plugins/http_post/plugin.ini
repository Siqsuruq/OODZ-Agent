[plugin]
name = http_post
description = Send an approved JSON POST request to the configured scoped HTTP service. Use only relative paths allowed by the plugin owner; the host cannot be selected by the model.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::http_post::execute
parameters = {"type":"object","properties":{"path":{"type":"string"},"json":{"type":"string"},"query":{"type":"object"}},"required":["path","json"],"additionalProperties":false}

[settings]
base_url = https://192.168.0.11/api/v2
allowed_path_prefixes = /
timeout_ms = 10000
max_response_chars = 65536
tls_verify = false
tls_ca_file =

[plugin]
name = search_files
description = Search UTF-8 text files for a case-insensitive literal string.
permission = read
entrypoint = plugin.tcl
handler = ::plugins::search_files::execute
parameters = {"type":"object","properties":{"query":{"type":"string","description":"Literal text to find."},"path":{"type":"string","description":"File or directory relative to the workspace root. Defaults to the workspace root."}},"required":["query"],"additionalProperties":false}

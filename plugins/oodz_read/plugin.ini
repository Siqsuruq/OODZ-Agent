[plugin]
name = oodz_read
description = Read a bounded, numbered line range from an OODZ framework UTF-8 source or documentation file after locating it with oodz_lookup.
category = framework
keywords = tcl,nx,naviserver,oodz
permission = read
entrypoint = plugin.tcl
handler = ::plugins::oodz_read::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"File path relative to the configured OODZ framework root."},"start_line":{"type":"integer","description":"First one-based line to return; defaults to 1."},"end_line":{"type":"integer","description":"Last one-based line to return; defaults to start_line plus 199."}},"required":["path"],"additionalProperties":false}

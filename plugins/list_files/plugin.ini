[plugin]
name = list_files
description = List files and directories at a path relative to the workspace root.
category = filesystem
keywords = file,directory,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::list_files::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Directory path relative to the workspace root. Defaults to the workspace root."}},"required":[],"additionalProperties":false}

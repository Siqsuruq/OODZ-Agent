[plugin]
name = fossil_diff
description = Show the current Fossil checkout diff using Fossil's internal unified diff engine. Optionally restrict output to one workspace-relative file.
category = vcs
keywords = repository,version control,source control,check-in
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_diff::execute
parameters = {"type":"object","properties":{"path":{"type":"string"}},"required":[],"additionalProperties":false}

[settings]
executable = fossil

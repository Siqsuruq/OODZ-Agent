[plugin]
name = http_get
description = Send a read-only GET request to the configured scoped HTTP service. Use only relative paths allowed by the plugin owner; the host cannot be selected by the model.
permission = read
entrypoint = plugin.tcl
handler = ::plugins::http_get::execute
parameters = {"type":"object","properties":{"path":{"type":"string"},"query":{"type":"object"}},"required":["path"],"additionalProperties":false}

[settings]
base_url = https://192.168.0.11/api/v2
allowed_path_prefixes = /
timeout_ms = 10000
max_response_chars = 65536
tls_verify = false
tls_ca_file =

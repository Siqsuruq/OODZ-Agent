[plugin]
name = fossil_branch_switch
description = Switch the entire current Fossil checkout to one named branch while retaining uncommitted changes. Autosync is disabled, the branch name is bounded, and approval is required.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_branch_switch::execute
parameters = {"type":"object","properties":{"name":{"type":"string"}},"required":["name"],"additionalProperties":false}

[settings]
executable = fossil
max_name_chars = 200

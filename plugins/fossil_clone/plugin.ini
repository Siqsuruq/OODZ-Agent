[plugin]
name = fossil_clone
description = Clone one public HTTP(S) Fossil repository into a new local repository database and sibling checkout under the configured workspace. Given name project, creates project.fossil and project/. Requires approval. Rejects credentials, query strings, fragments, existing destinations, private branches, transport overrides, and arbitrary options. To use other Fossil tools afterward, configure Workspace.root to the new checkout and restart OODZ.
category = vcs
keywords = fossil,repository,version control,source control,clone,download,checkout,remote
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_clone::execute
parameters = {"type":"object","properties":{"url":{"type":"string","minLength":1,"maxLength":2048,"description":"Public http:// or https:// Fossil repository URL without credentials, query string, or fragment."},"name":{"type":"string","minLength":1,"maxLength":100,"pattern":"^[A-Za-z0-9][A-Za-z0-9_.-]*$","description":"New sibling checkout and repository base name, without .fossil."}},"required":["url","name"],"additionalProperties":false}

[settings]
executable = fossil

[plugin]
name = fossil_branch_reopen
description = Reopen one named closed Fossil branch in the local repository. The branch name is bounded, autosync is disabled, and approval is required.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_branch_reopen::execute
parameters = {"type":"object","properties":{"name":{"type":"string"}},"required":["name"],"additionalProperties":false}

[settings]
executable = fossil
max_name_chars = 200

[plugin]
name = sqitch_log
description = Show a bounded, concise deployment event history for the default Sqitch target in the configured workspace. Requires the external sqitch executable and accepts no model-selected target, database URI, format, or filter expression.
category = database
keywords = sqitch,database,migration,schema,deployment,history,log
permission = read
entrypoint = plugin.tcl
handler = ::plugins::sqitch_log::execute
parameters = {"type":"object","properties":{"limit":{"type":"integer","minimum":1,"maximum":100,"description":"Maximum deployment events to return; defaults to 20."}},"required":[],"additionalProperties":false}

[settings]
executable = sqitch

[plugin]
name = oodz_lookup
description = Search the compact OODZ NaviServer/NX framework index before designing code that may use an existing OODZ component.
permission = read
entrypoint = plugin.tcl
handler = ::plugins::oodz_lookup::execute
parameters = {"type":"object","properties":{"query":{"type":"string","description":"Capability, class name, category, or keyword to find in the OODZ framework."}},"required":["query"],"additionalProperties":false}

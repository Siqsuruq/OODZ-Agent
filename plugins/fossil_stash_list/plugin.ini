[plugin]
name = fossil_stash_list
description = List all Fossil stash entries and their files in the current checkout. This read-only tool accepts no stash ID, repository path, width, or other options.
category = vcs
keywords = repository,version control,source control,check-in
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_stash_list::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

[plugin]
name = fossil_branch_new
description = Create one local Fossil branch from a named basis check-in. Autosync is disabled, names are bounded, and approval is required. The tool does not update the checkout to the new branch.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_branch_new::execute
parameters = {"type":"object","properties":{"name":{"type":"string"},"basis":{"type":"string"}},"required":["name","basis"],"additionalProperties":false}

[settings]
executable = fossil
max_name_chars = 200
max_basis_chars = 200

[plugin]
name = sqitch_status
description = Show the deployment status of the default Sqitch target for the project in the configured workspace. Requires the external sqitch executable and accepts no model-selected command, target, or database URI.
category = database
keywords = sqitch,database,migration,schema,deployment,status
permission = read
entrypoint = plugin.tcl
handler = ::plugins::sqitch_status::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = sqitch

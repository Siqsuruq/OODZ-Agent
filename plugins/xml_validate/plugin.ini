[plugin]
name = xml_validate
description = Validate a UTF-8 XML workspace file and report its root element before editing or transforming XML.
category = validation
keywords = xml,validate,well-formed,markup
permission = read
entrypoint = plugin.tcl
handler = ::plugins::xml_validate::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"XML file path relative to the workspace root."}},"required":["path"],"additionalProperties":false}

[plugin]
name = create_directory
description = Create one workspace directory and any missing parent directories. Use create_file separately to add a file with content.
category = filesystem
keywords = create,folder,directory,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::create_directory::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"New directory path relative to the workspace root."}},"required":["path"],"additionalProperties":false}

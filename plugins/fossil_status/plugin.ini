[plugin]
name = fossil_status
description = Show the status of the Fossil checkout rooted at the configured workspace, including local changes and checkout metadata. This read-only tool accepts no model-selected command or path.
category = vcs
keywords = repository,version control,source control,check-in
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_status::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

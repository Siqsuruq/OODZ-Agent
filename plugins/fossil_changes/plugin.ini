[plugin]
name = fossil_changes
description = List the files that would be included in the next Fossil commit, with change classifications and workspace-relative paths. This concise read-only tool accepts no arguments.
category = vcs
keywords = repository,version control,source control,check-in
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_changes::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

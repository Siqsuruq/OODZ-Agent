[plugin]
name = fossil_pull
description = Pull public sharable changes from the checkout's configured default Fossil remote into its local repository. This network operation requires approval and accepts no URL, credentials, repository path, or options. It does not update working files.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_pull::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

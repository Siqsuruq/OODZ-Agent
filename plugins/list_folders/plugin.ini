[plugin]
name = list_folders
description = List only immediate folders at a path relative to the workspace root. Files are omitted.
category = filesystem
keywords = folder,directory,directories,workspace,browse
permission = read
entrypoint = plugin.tcl
handler = ::plugins::list_folders::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Directory path relative to the workspace root. Defaults to the workspace root."}},"required":[],"additionalProperties":false}


[plugin]
name = list_directory
description = List the immediate files and subdirectories in one known workspace directory. This is not recursive; use find_files to locate names anywhere.
category = filesystem
keywords = list,browse,files,folders,directory,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::list_directory::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Directory relative to the workspace root. Defaults to the workspace root."}},"required":[],"additionalProperties":false}

[plugin]
name = sqitch_revert
description = Revert deployed Sqitch changes back to one explicitly named change or tag on the project's configured default target. This destructive database operation requires approval and never permits reverting everything or selecting a target, database URI, variable, client, registry, or arbitrary option.
category = database
keywords = sqitch,database,migration,schema,deployment,revert,rollback,undo,change,tag
permission = write
entrypoint = plugin.tcl
handler = ::plugins::sqitch_revert::execute
parameters = {"type":"object","properties":{"to":{"type":"string","minLength":1,"maxLength":200,"description":"Required deployed change or tag to retain as the last deployed change."}},"required":["to"],"additionalProperties":false}

[settings]
executable = sqitch

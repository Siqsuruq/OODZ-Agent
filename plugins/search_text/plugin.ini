[plugin]
name = search_text
description = Recursively search UTF-8 workspace file contents for a case-insensitive literal string. Use find_files instead when searching by filename.
category = filesystem
keywords = text,content,grep,literal,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::search_text::execute
parameters = {"type":"object","properties":{"query":{"type":"string","description":"Literal text to find inside files."},"path":{"type":"string","description":"File or directory relative to the workspace root. Defaults to the workspace root."}},"required":["query"],"additionalProperties":false}

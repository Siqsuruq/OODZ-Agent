[plugin]
name = fossil_extras
description = List unmanaged files in the Fossil checkout using workspace-relative paths. Ignore rules remain controlled by the checkout owner, and the tool accepts no paths, globs, or options.
category = vcs
keywords = repository,version control,source control,check-in
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_extras::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

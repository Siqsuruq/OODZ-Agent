[plugin]
name = fossil_timeline
description = Show a bounded, concise timeline of recent Fossil check-ins. The optional limit must be between 1 and 100 and defaults to 20.
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_timeline::execute
parameters = {"type":"object","properties":{"limit":{"type":"integer"}},"required":[],"additionalProperties":false}

[settings]
executable = fossil
default_limit = 20
maximum_limit = 100

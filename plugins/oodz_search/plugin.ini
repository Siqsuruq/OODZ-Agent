[plugin]
name = oodz_search
description = Recursively search OODZ framework UTF-8 source and documentation for a case-insensitive literal string, then use oodz_read for relevant ranges.
category = framework
keywords = tcl,nx,naviserver,oodz
permission = read
entrypoint = plugin.tcl
handler = ::plugins::oodz_search::execute
parameters = {"type":"object","properties":{"query":{"type":"string","description":"Literal framework text, method, property, or class name to find."},"path":{"type":"string","description":"Optional file or directory relative to the configured OODZ root; defaults to the root."}},"required":["query"],"additionalProperties":false}

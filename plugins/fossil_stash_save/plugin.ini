[plugin]
name = fossil_stash_save
description = Save all current Fossil checkout changes as a new stash with a required comment, then revert the checkout to its baseline. The comment is bounded and approval is required.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_stash_save::execute
parameters = {"type":"object","properties":{"comment":{"type":"string"}},"required":["comment"],"additionalProperties":false}

[settings]
executable = fossil
max_comment_chars = 1000

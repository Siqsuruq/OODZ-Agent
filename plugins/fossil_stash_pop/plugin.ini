[plugin]
name = fossil_stash_pop
description = Apply the most recently created Fossil stash to the current checkout and remove that stash entry. This can cause merge conflicts and requires approval. It accepts no stash ID or options.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_stash_pop::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

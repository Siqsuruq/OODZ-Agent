[plugin]
name = find_files
description = Recursively find workspace files or directories whose names match a case-insensitive glob pattern. Use search_text instead to search file contents.
category = filesystem
keywords = find,filename,path,glob,directory,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::find_files::execute
parameters = {"type":"object","properties":{"pattern":{"type":"string","description":"Filename glob pattern, for example cur.tcl, *.tcl, or *clinic*. Matching is case-insensitive."},"path":{"type":"string","description":"Directory relative to the workspace root. Defaults to the workspace root."},"type":{"type":"string","enum":["all","file","directory"],"description":"Kind of entry to return. Defaults to all."}},"required":["pattern"],"additionalProperties":false}

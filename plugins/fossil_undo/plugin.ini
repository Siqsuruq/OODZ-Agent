[plugin]
name = fossil_undo
description = Restore exactly one workspace-relative file from Fossil's single-level undo snapshot. The path may currently be missing because undo can restore deleted files. This operation requires approval.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_undo::execute
parameters = {"type":"object","properties":{"path":{"type":"string"}},"required":["path"],"additionalProperties":false}

[settings]
executable = fossil

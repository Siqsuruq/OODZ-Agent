[plugin]
name = system_info
description = Report the agent runtime environment, including operating system, architecture, Tcl version, thread package version, executable, and workspace.
category = system
keywords = system,environment,os,operating system,platform,architecture,version,tcl,runtime,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::system_info::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}


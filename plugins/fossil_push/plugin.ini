[plugin]
name = fossil_push
description = Push public sharable changes from the local Fossil repository to the checkout's configured default remote. This outbound network operation requires approval and accepts no URL, credentials, repository path, private-branch flag, or other options.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_push::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

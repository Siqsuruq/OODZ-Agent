[plugin]
name = delete_directory
description = Delete one workspace directory. It must be empty unless recursive is explicitly true; use delete_file for files.
category = filesystem
keywords = delete,remove,folder,directory,recursive,workspace
permission = write
entrypoint = plugin.tcl
handler = ::plugins::delete_directory::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"Existing directory path relative to the workspace root. The workspace root itself cannot be deleted."},"recursive":{"type":"boolean","description":"Delete all directory contents recursively. Defaults to false."}},"required":["path"],"additionalProperties":false}

[plugin]
name = sqitch_show
description = Show metadata or script content for one named Sqitch change or tag in the configured workspace. The view is restricted to change, tag, deploy, revert, or verify, and the object identifier cannot be interpreted as a command option.
category = database
keywords = sqitch,database,migration,schema,change,tag,deploy,revert,verify,script,inspect,show
permission = read
entrypoint = plugin.tcl
handler = ::plugins::sqitch_show::execute
parameters = {"type":"object","properties":{"object":{"type":"string","minLength":1,"maxLength":200,"description":"Sqitch change name, tag such as @v1.0, change ID, or qualified change name."},"view":{"type":"string","enum":["change","tag","deploy","revert","verify"],"description":"Information or script type to show; defaults to change."}},"required":["object"],"additionalProperties":false}

[settings]
executable = sqitch

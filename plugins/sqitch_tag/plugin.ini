[plugin]
name = sqitch_tag
description = Tag one explicitly named Sqitch change in the default plan with a safely named tag and bounded note. This plan mutation requires approval and forces single-plan behavior. Targets, engines, plan paths, multi-plan mode, and arbitrary options are unavailable to the model.
category = database
keywords = sqitch,database,migration,schema,change,tag,release,version,plan
permission = write
entrypoint = plugin.tcl
handler = ::plugins::sqitch_tag::execute
parameters = {"type":"object","properties":{"tag":{"type":"string","minLength":1,"maxLength":200,"pattern":"^[A-Za-z0-9][A-Za-z0-9_.+-]*$","description":"New tag name without the leading @."},"change":{"type":"string","minLength":1,"maxLength":200,"description":"Existing change name, qualified change, ID, or @HEAD to tag explicitly."},"note":{"type":"string","minLength":1,"maxLength":500,"description":"Brief reason or release description for the tag."}},"required":["tag","change","note"],"additionalProperties":false}

[settings]
executable = sqitch

[plugin]
name = zip
description = Create a ZIP archive from one existing workspace directory using Tcl 9 zipfs. The destination must not already exist.
category = archive
keywords = zip,archive,compress,package,directory
permission = write
entrypoint = plugin.tcl
handler = ::plugins::zip::execute
parameters = {"type":"object","properties":{"source":{"type":"string","description":"Existing directory relative to the workspace root."},"destination":{"type":"string","description":"New .zip file relative to the workspace root."}},"required":["source","destination"],"additionalProperties":false}


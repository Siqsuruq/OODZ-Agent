[plugin]
name = sqitch_rework
description = Rework one safely named existing change in the default Sqitch plan with a required bounded note. This copies the prior scripts and updates the plan, requires approval, and disables multi-plan and editor behavior. Dependencies, conflicts, targets, plan paths, variables, and arbitrary options are unavailable to the model.
category = database
keywords = sqitch,database,migration,schema,change,rework,revise,script,plan
permission = write
entrypoint = plugin.tcl
handler = ::plugins::sqitch_rework::execute
parameters = {"type":"object","properties":{"change":{"type":"string","minLength":1,"maxLength":200,"pattern":"^[A-Za-z0-9][A-Za-z0-9_.+-]*$","description":"Existing change name using letters, digits, underscore, dot, plus, or hyphen."},"note":{"type":"string","minLength":1,"maxLength":500,"description":"Brief reason for reworking the change."}},"required":["change","note"],"additionalProperties":false}

[settings]
executable = sqitch

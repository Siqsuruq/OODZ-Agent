[plugin]
name = read_file
description = Read a UTF-8 workspace file, optionally as a numbered line range. Requests over 200 lines are automatically truncated. Prefer focused ranges for large files.
category = filesystem
keywords = file,directory,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::read_file::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"File path relative to the workspace root."},"start_line":{"type":"integer","description":"Optional first one-based line. When supplied without end_line, at most 200 lines are returned."},"end_line":{"type":"integer","description":"Optional inclusive last one-based line. Spans over 200 lines are truncated rather than rejected."}},"required":["path"],"additionalProperties":false}

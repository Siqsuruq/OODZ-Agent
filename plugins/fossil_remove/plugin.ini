[plugin]
name = fossil_remove
description = Mark exactly one existing workspace-relative file as removed in Fossil and delete it from disk. This destructive operation requires approval and is not recoverable through fossil_undo.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_remove::execute
parameters = {"type":"object","properties":{"path":{"type":"string"}},"required":["path"],"additionalProperties":false}

[settings]
executable = fossil

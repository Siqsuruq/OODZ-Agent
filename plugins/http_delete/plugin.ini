[plugin]
name = http_delete
description = Send an approved DELETE request to the configured scoped HTTP service. Supports an optional JSON body and only plugin-owner-approved relative paths.
permission = write
entrypoint = plugin.tcl
handler = ::plugins::http_delete::execute
parameters = {"type":"object","properties":{"path":{"type":"string"},"json":{"type":"string"},"query":{"type":"object"}},"required":["path"],"additionalProperties":false}

[settings]
base_url = https://192.168.0.11/api/v2
allowed_path_prefixes = /
timeout_ms = 10000
max_response_chars = 65536
tls_verify = false
tls_ca_file =

[plugin]
name = file_info
description = Inspect a workspace path's type, size, modification time, and permissions before another filesystem operation.
category = filesystem
keywords = file,directory,workspace
permission = read
entrypoint = plugin.tcl
handler = ::plugins::file_info::execute
parameters = {"type":"object","properties":{"path":{"type":"string","description":"File or directory path relative to the workspace root."}},"required":["path"],"additionalProperties":false}

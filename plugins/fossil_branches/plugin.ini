[plugin]
name = fossil_branches
description = List all Fossil branches in the current checkout, including closed branches. The current branch is marked by Fossil. This read-only tool accepts no patterns, repositories, users, or options.
permission = read
entrypoint = plugin.tcl
handler = ::plugins::fossil_branches::execute
parameters = {"type":"object","properties":{},"required":[],"additionalProperties":false}

[settings]
executable = fossil

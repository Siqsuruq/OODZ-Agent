[plugin]
name = database_query
description = Run one parameterized SQL query through a configured read-only TDBC connection and return bounded rows.
category = database
keywords = database,sql,tdbc,postgres,select,query
permission = read
entrypoint = plugin.tcl
handler = ::plugins::database_query::execute
parameters = {"type":"object","properties":{"profile":{"type":"string","description":"Configured profile name; omit to use default_profile."},"sql":{"type":"string","minLength":1,"description":"One SQL query using TDBC :name bound parameters."},"parameters":{"type":"object","description":"Values for named SQL parameters."},"max_rows":{"type":"integer","minimum":1,"description":"Requested row limit, capped by the profile file."}},"required":["sql"],"additionalProperties":false}

[settings]
profile_file = conf/databases.ini

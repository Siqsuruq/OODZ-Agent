[plugin]
name = fossil_commit
description = Commit all current Fossil checkout changes locally with a required message. The command disables autosync and interactive prompts and requires approval.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_commit::execute
parameters = {"type":"object","properties":{"message":{"type":"string"}},"required":["message"],"additionalProperties":false}

[settings]
executable = fossil
max_message_chars = 1000

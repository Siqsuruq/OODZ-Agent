[plugin]
name = sqitch_plan
description = Show a bounded, concise list of planned Sqitch changes for the project in the configured workspace. Requires the external sqitch executable and accepts no model-selected target, database URI, plan path, format, filter expression, or arbitrary option.
category = database
keywords = sqitch,database,migration,schema,deployment,plan,changes,pending
permission = read
entrypoint = plugin.tcl
handler = ::plugins::sqitch_plan::execute
parameters = {"type":"object","properties":{"limit":{"type":"integer","minimum":1,"maximum":500,"description":"Maximum planned events to return; defaults to 100."}},"required":[],"additionalProperties":false}

[settings]
executable = sqitch
default_limit = 100
maximum_limit = 500

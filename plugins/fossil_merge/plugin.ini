[plugin]
name = fossil_merge
description = Merge one named Fossil branch or check-in into the current checkout without committing. The source is bounded, autosync is disabled, Fossil undo remains enabled, and approval is required. Conflicts may require manual resolution.
category = vcs
keywords = repository,version control,source control,check-in
permission = write
entrypoint = plugin.tcl
handler = ::plugins::fossil_merge::execute
parameters = {"type":"object","properties":{"source":{"type":"string"}},"required":["source"],"additionalProperties":false}

[settings]
executable = fossil
max_source_chars = 200

[database]
# Profile used when a tool call omits its profile argument.
default_profile = development
# Highest max_rows value accepted by database_query.
max_rows = 100
# Maximum characters retained for each returned database value.
max_value_chars = 4096

[development]
# TDBC driver package installed for the same Tcl 9 runtime as OODZ Agent.
package = tdbc::postgres
# Driver-specific option/value Tcl list. Do not put the password here.
options = -host 127.0.0.1 -port 5432 -user clinic_agent -database clinic
# Environment variable containing the password; its value is never logged.
password_env = OODZ_DATABASE_PASSWORD
# database_execute rejects this profile unless explicitly enabled.
allow_write = false

[LLM]
provider = deepseek
url = https://api.deepseek.com/chat/completions
api_key = replace-with-your-key
model = deepseek-v4-flash
thinking = false
timeout = 60000
max_retries = 2
retry_delay_ms = 250

[Agent]
name = CoderBot
role = You are a professional software engineering agent. Follow the user's requirements precisely, inspect relevant context, use available tools when appropriate, and produce focused, verified changes.
max_iterations = 24
max_history_messages = 200
max_history_chars = 60000
summarize_history = true
history_file = .oodz/history.json

[Workspace]
root = .
instructions = AGENT.md
instructions_max_file_bytes = 16384
instructions_max_total_bytes = 65536

[OODZ]
root =

[Plugins]
directories =
lazy_loading = true
worker_thread = true
timeout_ms = 10000
max_output_chars = 65536

[Skills]
directories =
max_file_bytes = 65536

[Executables]
fossil = fossil

[Fossil]
# Optional checkout directory relative to Workspace.root.
checkout =

[Runner]
enabled = false
tclsh = tclsh9.0
timeout_ms = 10000
max_output_chars = 65536
project_tests_enabled = false
project_tests_executable = tclsh9.0
project_tests_arguments = tests/all.tcl
project_tests_timeout_ms = 60000

[CommandExecution]
# Generic structured process execution is disabled by default.
enabled = false
# allowlist accepts only names below; unrestricted accepts any resolvable
# executable and is effectively full execution as the agent user's account.
mode = allowlist
allowed_executables = ffmpeg,ffprobe,rg
# Version 1 intentionally requires approval for every command.
approval = always
timeout_ms = 60000
max_timeout_ms = 600000
max_output_chars = 1048576

[CommandExecution.ffmpeg]
executable = ffmpeg
allowed_prefixes = *

[CommandExecution.ffprobe]
executable = ffprobe
allowed_prefixes = *

[CommandExecution.rg]
executable = rg
# Each outer Tcl-list item is an allowed argument prefix. Use * for any args.
allowed_prefixes = {-n} {--files} {--version}

[Logging]
file = .oodz/oodz.log
level = info

[Diagnostics]
enabled = true
file = .oodz/diagnostics.jsonl
max_events = 5000

[ChangeTracking]
# Show files added, modified, or deleted after each interactive agent turn.
enabled = true
# Runtime and version-control metadata should not appear as agent changes.
excluded_directories = .git,.hg,.svn,.oodz
# Files at or below this size are checksummed; larger files use metadata.
max_hash_bytes = 4194304

[GUI]
theme_package = ttk::theme::Arc
theme = Arc-Dark

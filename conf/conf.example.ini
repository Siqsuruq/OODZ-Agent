[LLM]
# Provider adapter to use. Supported values are deepseek and ollama.
provider = deepseek
# OpenAI-compatible chat-completions endpoint used for model requests.
url = https://api.deepseek.com/chat/completions
# Provider credential. Required by DeepSeek, optional for local Ollama; keep private.
api_key = replace-with-your-key
# Model identifier sent to the configured provider.
model = deepseek-v4-flash
# Ask the provider for thinking/reasoning output when the model supports it.
thinking = false
# Maximum duration of one model HTTP request, in milliseconds.
timeout = 60000
# Number of retries after the first failed request; 0 disables retries.
max_retries = 2
# Initial retry delay in milliseconds; later retries use exponential backoff.
retry_delay_ms = 250

[Agent]
# Agent name used in runtime log messages.
name = CoderBot
# Base system instruction placed before the conversation and workspace instructions.
role = You are a professional software engineering agent. Follow the user's requirements precisely, inspect relevant context, use available tools when appropriate, and produce focused, verified changes.
# Maximum model-response cycles, including tool-call cycles, allowed per user task.
max_iterations = 24
# Maximum number of prior message objects sent to the model; tool-call turns stay intact.
max_history_messages = 200
# Approximate character budget for prior messages and retained tool results.
max_history_chars = 60000
# Preserve context by summarizing older complete turns when history is compacted.
summarize_history = true
# Conversation-history JSON file; relative paths resolve from the application directory.
history_file = .oodz/history.json

[Workspace]
# Filesystem root exposed to workspace tools; the directory must already exist.
root = .
# UTF-8 instruction filename, relative to Workspace.root and discovered hierarchically.
instructions = AGENT.md
# Maximum permitted size of each discovered instruction file, in bytes.
instructions_max_file_bytes = 16384
# Maximum combined instruction content for one target path, in bytes.
instructions_max_total_bytes = 65536

[OODZ]
# Read-only OODZ framework source root; blank disables framework reference tools.
root =

[Plugins]
# Extra plugin roots, comma-separated; built-in plugins are always loaded.
directories =
# Initially expose only core tools and discover other plugins through search_plugins.
lazy_loading = true
# Run approved plugin handlers serially in a persistent Tcl worker thread.
worker_thread = true
# Maximum execution time for one plugin call, in milliseconds.
timeout_ms = 10000
# Maximum number of plugin-result characters returned to the model.
max_output_chars = 65536

[Skills]
# Extra skill roots, comma-separated; built-in skills are always loaded first.
directories =
# Maximum permitted size of one SKILL.md file, in bytes.
max_file_bytes = 65536

[Executables]
# Trusted Fossil executable name or absolute path shared by Fossil plugins.
fossil = fossil

[Fossil]
# Fossil checkout directory relative to Workspace.root; blank means the workspace root.
checkout =

[Runner]
# Expose the controlled run_tcl_file tool when true.
enabled = false
# Fixed Tcl interpreter executable used by run_tcl_file.
tclsh = tclsh9.0
# Maximum execution time for a Tcl file, in milliseconds.
timeout_ms = 10000
# Maximum combined stdout/stderr characters returned by a Tcl process.
max_output_chars = 65536
# Expose the fixed run_project_tests profile when true.
project_tests_enabled = false
# Trusted executable used for the project-test profile; the model cannot replace it.
project_tests_executable = tclsh9.0
# Trusted Tcl-list arguments passed directly to the test executable without a shell.
project_tests_arguments = tests/all.tcl
# Maximum duration of the complete project-test process, in milliseconds.
project_tests_timeout_ms = 60000

[CommandExecution]
# Enable the generic structured command-execution tool.
enabled = false
# Execution policy: allowlist permits configured names; unrestricted permits any
# resolvable executable and is effectively full execution as the agent OS user.
mode = allowlist
# Comma-separated command names permitted when mode is allowlist.
allowed_executables = ffmpeg,ffprobe,rg
# Approval policy. The currently supported value, always, prompts for every command.
approval = always
# Default maximum duration of one command, in milliseconds.
timeout_ms = 60000
# Highest timeout a tool request may select, in milliseconds.
max_timeout_ms = 600000
# Maximum combined stdout/stderr characters returned by a command.
max_output_chars = 1048576

[CommandExecution.ffmpeg]
# Executable name or absolute path used for the ffmpeg command alias.
executable = ffmpeg
# Allowed argument-prefix Tcl list; * permits every ffmpeg argument list.
allowed_prefixes = *

[CommandExecution.ffprobe]
# Executable name or absolute path used for the ffprobe command alias.
executable = ffprobe
# Allowed argument-prefix Tcl list; * permits every ffprobe argument list.
allowed_prefixes = *

[CommandExecution.rg]
# Executable name or absolute path used for the rg command alias.
executable = rg
# Each outer Tcl-list item is an allowed argument prefix; * would permit any arguments.
allowed_prefixes = {-n} {--files} {--version}

[Logging]
# Diagnostic log file; relative paths resolve from the application directory.
file = .oodz/oodz.log
# Minimum log severity written to the log file.
level = info

[Diagnostics]
# Collect provider-neutral request, token, tool-call, timing, and failure metrics.
enabled = true
# Append-only JSON Lines metrics file; relative paths resolve from the application directory.
file = .oodz/diagnostics.jsonl
# Maximum retained structured events; must be at least 100, oldest events are discarded.
max_events = 5000

[ChangeTracking]
# Show files added, modified, or deleted after each interactive agent turn.
enabled = true
# Comma-separated directory names excluded from change snapshots.
excluded_directories = .git,.hg,.svn,.oodz
# Maximum file size checksummed exactly, in bytes; larger files use metadata.
max_hash_bytes = 4194304

[GUI]
# Optional Tcl package loaded before the GUI theme is selected; blank loads none.
theme_package = ttk::theme::Arc
# Installed Ttk theme name; blank uses the platform-default theme.
theme = Arc-Dark

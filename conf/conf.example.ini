[LLM]
provider = deepseek
url = https://api.deepseek.com/chat/completions
api_key = replace-with-your-key
model = deepseek-v4-flash
thinking = false
timeout = 60000
max_retries = 2
retry_delay_ms = 250

[Agent]
name = CoderBot
role = You are an expert Tcl programmer who writes short, clean code.
max_iterations = 16
max_history_messages = 40
summarize_history = false
history_file = .oodz/history.json

[Workspace]
root = .
instructions = AGENT.md
instructions_max_file_bytes = 16384
instructions_max_total_bytes = 65536

[OODZ]
root =

[Plugins]
directories =
lazy_loading = true
core = read_file,list_files,search_files,file_info,apply_patch,write_file
worker_thread = true
timeout_ms = 10000
max_output_chars = 65536

[Skills]
directories =
max_file_bytes = 65536

[Executables]
fossil = fossil

[Runner]
enabled = false
tclsh = tclsh9.0
timeout_ms = 10000
max_output_chars = 65536
project_tests_enabled = false
project_tests_executable = tclsh9.0
project_tests_arguments = tests/all.tcl
project_tests_timeout_ms = 60000

[Logging]
file = .oodz/oodz.log
level = info

[GUI]
theme_package = ttk::theme::Arc
theme = Arc-Dark
